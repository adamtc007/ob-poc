[package]
name = "ob-poc-kyc-substrate"
version = "0.1.0"
edition = "2021"
description = "KYC/UBO W1 substrate: event contract, lexicon, control fold, obligation fold, determination. In-memory; no schema."

# No sqlx. No sem_os_core (git dep — heavy/DB-adjacent). No DB. Pure semantic
# model. semantic-decision-contracts is an explicit exception: same upstream
# repo (github.com/adamtc007/dsl), but a bare host-neutral vocabulary crate
# (hex/serde/sha2/thiserror only, no DB) — see
# docs/todo/EOP-PLAN-KYCUBO-KIT-T7_Plain-English-Ramp_v0.1.md §7/§8 for the
# shared-vocabulary rationale.
[dependencies]
anyhow      = "1.0"
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
sha2        = "0.10"
hex         = "0.4"
thiserror   = "1.0"
uuid        = { version = "1.4", features = ["v4", "v5", "serde"] }
smallvec    = { version = "1.11", features = ["serde"] }
semantic-decision-contracts.workspace = true

[dev-dependencies]
# dsl-parser: T1 round-trip equivalence gate (parse(render(event)) ≡ event).
# Pure crate, dev-only — does not touch the no-sqlx/no-DB production dep list.
dsl-parser = { path = "../dsl-parser" }

[lints.rust]
unreachable_pub = "deny"
dead_code = "deny"
