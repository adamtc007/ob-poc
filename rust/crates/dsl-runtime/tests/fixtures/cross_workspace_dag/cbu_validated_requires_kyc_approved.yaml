name: "CBU structural validation is independent of KYC"
suite_id: "cbu_validation_domain_isolation"
description: |
  CBU VALIDATION_PENDING → VALIDATED is a structural transition. KYC remains
  a separate domain and does not gate this transition; good-to-transact policy
  is evaluated at the operational boundary instead.

entity_aliases:
  cbu-1:  "00000000-0000-0000-0000-000000000010"
  case-1: "00000000-0000-0000-0000-000000000011"

initial_state:
  - { workspace: cbu, slot: cbu,     entity: "cbu-1",  state: "VALIDATION_PENDING" }
  - { workspace: kyc, slot: kyc_case, entity: "case-1", state: "REVIEW" }

predicates:
  "cases.sponsor_cbu_id = this_cbu.cbu_id OR cases.client_group_id = this_cbu.primary_client_group_id":
    - { target: "cbu-1", source: "case-1" }

steps:
  - name: "structural validation succeeds while KYC remains in REVIEW"
    check_transition:
      workspace: cbu
      slot: cbu
      entity: "cbu-1"
      from: "VALIDATION_PENDING"
      to: "VALIDATED"
    expect:
      violations: []

  - mutate:
      - { workspace: kyc, slot: kyc_case, entity: "case-1", state: "APPROVED" }

  - name: "structural validation remains independent after KYC approval"
    check_transition:
      workspace: cbu
      slot: cbu
      entity: "cbu-1"
      from: "VALIDATION_PENDING"
      to: "VALIDATED"
    expect:
      violations: []
