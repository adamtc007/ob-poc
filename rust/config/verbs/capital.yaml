# ============================================================================
# Capital Structure Verbs
# ============================================================================
# Issuer-side supply management: share classes, issuance, splits, buybacks,
# dilution instruments (options, warrants, SAFEs), control configuration.

domains:
  capital:
    description: Capital structure management - share classes, issuance events, dilution instruments

    verbs:
      # --------------------------------------------------------------------------
      # Share Class Management
      # --------------------------------------------------------------------------
      #
      # capital.share-class.create and capital.share-class.get-supply were
      # deleted 2026-08-19 (EOP-PLAN capital/share-class consolidation):
      # both referenced schema that never existed live
      # (share_classes.authorized_shares / .issued_shares,
      # fn_share_class_supply_at()) and would have errored at runtime; ops
      # were unreachable anyway (no Domain Pack ever owned `capital.`). The
      # create step is now `share-class.create`
      # (config/verbs/registry/share-class.yaml, CRUD), extended with
      # issuer-entity-id/instrument-kind/votes-per-unit/economic-per-unit.

      share-class.add-identifier:
        flavour: instance_adding
        description: Add an identifier (ISIN, SEDOL, etc.) to a share class
        effect_class: append_fact
        invocation_phrases:
          - "add share class identifier"
          - "set share class ISIN"
          - "add identifier to share class"
          - "register share class code"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: crud
        crud:
          operation: insert
          table: share_class_identifiers
          schema: ob-poc
          returning: identifier_id
        args:
          - name: share-class-id
            type: uuid
            required: true
            maps_to: share_class_id
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: scheme
            type: string
            required: true
            maps_to: scheme_code
            validation:
              enum:
                - ISIN
                - SEDOL
                - CUSIP
                - FIGI
                - LEI
                - INTERNAL
                - FUND_ADMIN
                - REGISTRY
                - TA_REF
          - name: value
            type: string
            required: true
            maps_to: identifier_value
          - name: is-primary
            type: boolean
            required: false
            default: false
            maps_to: is_primary
          - name: source
            type: string
            required: false
            maps_to: source
        returns:
          type: uuid
          name: identifier_id
          capture: true

        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      share-class.list:
        flavour: attribute_mutating
        description: List share classes for an issuer
        effect_class: read_snapshot
        invocation_phrases:
          - "show share classes"
          - "get all share classes"
          - "what share classes exist"
          - "display share classes"
          - "capital share class list"
        metadata:
          tier: reference
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: facts_only
        behavior: crud
        crud:
          operation: list_by_fk
          table: share_classes
          schema: ob-poc
          fk_col: issuer_entity_id
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            maps_to: issuer_entity_id
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
        returns:
          type: record_set

        three_axis:
          state_effect: preserving
          external_effects:
            - observational
          consequence:
            baseline: benign
      # --------------------------------------------------------------------------
      # Issuance Events
      # --------------------------------------------------------------------------

      issue.initial:
        flavour: attribute_mutating
        description: Initial issuance of shares (incorporation/fund launch)
        effect_class: read_modify_write
        invocation_phrases:
          - "initial share issuance"
          - "IPO shares"
          - "issue initial shares"
          - "initial offering"
          - "first issuance"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalIssueInitialOp
        args:
          - name: share-class-id
            type: uuid
            required: true
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: units
            type: decimal
            required: true
          - name: price-per-unit
            type: decimal
            required: false
          - name: effective-date
            type: date
            required: false
            description: Defaults to today
          - name: board-resolution-ref
            type: string
            required: false
        returns:
          type: uuid
          name: event_id
          capture: true
        produces:
          type: issuance_event

        three_axis:
          state_effect: preserving
          external_effects: &id001
            - emitting
          consequence:
            baseline: requires_confirmation
      issue.new:
        flavour: attribute_mutating
        description: Subsequent issuance (capital raise)
        effect_class: read_modify_write
        invocation_phrases:
          - "secondary issuance"
          - "additional share issue"
          - "issue more shares"
          - "new share issuance"
          - "print more shares"
          - "capital raise"
          - "do a rights issue"
          - "allot new shares"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalIssueNewOp
        args:
          - name: share-class-id
            type: uuid
            required: true
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: units
            type: decimal
            required: true
          - name: price-per-unit
            type: decimal
            required: true
          - name: effective-date
            type: date
            required: false
          - name: board-resolution-ref
            type: string
            required: false
        returns:
          type: uuid
          name: event_id
          capture: true
        produces:
          type: issuance_event

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      split:
        flavour: attribute_mutating
        description: Stock split (e.g., 2:1 doubles shares)
        effect_class: read_modify_write
        invocation_phrases:
          - "stock split"
          - "share split"
          - "split shares"
          - "divide shares"
          - "reverse split"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalSplitOp
        args:
          - name: share-class-id
            type: uuid
            required: true
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: ratio-from
            type: integer
            required: true
            description: "Original shares (e.g., 1 in 2:1 split)"
          - name: ratio-to
            type: integer
            required: true
            description: "New shares (e.g., 2 in 2:1 split)"
          - name: effective-date
            type: date
            required: false
          - name: record-date
            type: date
            required: false
        returns:
          type: uuid
          name: event_id
          capture: true
        produces:
          type: issuance_event

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      buyback:
        flavour: attribute_mutating
        description: Share buyback into treasury
        effect_class: read_modify_write
        invocation_phrases:
          - "share buyback"
          - "buy back shares"
          - "stock buyback"
          - "repurchase shares"
          - "treasury share purchase"
          - "buy shares back from investors"
          - "treasury stock purchase"
          - "share repurchase program"
          - "retire some shares"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalBuybackOp
        args:
          - name: share-class-id
            type: uuid
            required: true
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: units
            type: decimal
            required: true
          - name: price-per-unit
            type: decimal
            required: true
          - name: effective-date
            type: date
            required: false
        returns:
          type: uuid
          name: event_id
          capture: true
        produces:
          type: issuance_event

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      cancel:
        flavour: attribute_mutating
        description: Permanent share cancellation
        effect_class: read_modify_write
        invocation_phrases:
          - "cancel shares"
          - "retire shares"
          - "cancel treasury shares"
          - "extinguish shares"
          - "reduce share capital"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalCancelOp
        args:
          - name: share-class-id
            type: uuid
            required: true
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: units
            type: decimal
            required: true
          - name: effective-date
            type: date
            required: false
          - name: reason
            type: string
            required: false
        returns:
          type: uuid
          name: event_id
          capture: true
        produces:
          type: issuance_event

      # --------------------------------------------------------------------------
      # Dilution Instruments (Options, Warrants, Convertibles)
      # --------------------------------------------------------------------------

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.grant-options:
        flavour: attribute_mutating
        description: Grant stock options to a holder
        effect_class: read_modify_write
        invocation_phrases:
          - "grant stock options"
          - "issue employee options"
          - "option grant"
          - "create option grant"
          - "allocate stock options"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalDilutionGrantOptionsOp
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: converts-to-share-class-id
            type: uuid
            required: true
            description: Share class these options convert into
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: holder-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: units
            type: decimal
            required: true
            description: Number of options granted
          - name: exercise-price
            type: decimal
            required: true
          - name: exercise-currency
            type: string
            required: false
            default: "USD"
          - name: vesting-start-date
            type: date
            required: false
          - name: vesting-end-date
            type: date
            required: false
            description: Fully vested by this date
          - name: vesting-cliff-months
            type: integer
            required: false
            default: 12
          - name: expiration-date
            type: date
            required: true
          - name: plan-name
            type: string
            required: false
        returns:
          type: uuid
          name: instrument_id
          capture: true
        produces:
          type: dilution_instrument

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.issue-warrant:
        flavour: attribute_mutating
        description: Issue warrants to an investor
        effect_class: read_modify_write
        invocation_phrases:
          - "issue warrant"
          - "create warrant"
          - "new warrant issuance"
          - "grant warrants"
          - "issue equity warrant"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalDilutionIssueWarrantOp
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: converts-to-share-class-id
            type: uuid
            required: true
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: holder-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: units
            type: decimal
            required: true
          - name: exercise-price
            type: decimal
            required: true
          - name: exercisable-from
            type: date
            required: false
          - name: expiration-date
            type: date
            required: true
        returns:
          type: uuid
          name: instrument_id
          capture: true
        produces:
          type: dilution_instrument

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.create-safe:
        flavour: attribute_mutating
        description: Create a SAFE (Simple Agreement for Future Equity)
        effect_class: read_modify_write
        invocation_phrases:
          - "create SAFE"
          - "issue SAFE"
          - "new SAFE agreement"
          - "simple agreement for future equity"
          - "create SAFE note"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalDilutionCreateSafeOp
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: converts-to-share-class-id
            type: uuid
            required: false
            description: May be NULL until priced round
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: holder-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: principal-amount
            type: decimal
            required: true
          - name: valuation-cap
            type: decimal
            required: false
          - name: discount-pct
            type: decimal
            required: false
            description: Discount to next round price (e.g., 20 for 20%)
        returns:
          type: uuid
          name: instrument_id
          capture: true
        produces:
          type: dilution_instrument

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.create-convertible-note:
        flavour: attribute_mutating
        description: Create a convertible note
        effect_class: read_modify_write
        invocation_phrases:
          - "create convertible note"
          - "issue convertible"
          - "new convertible debt"
          - "convertible loan note"
          - "create convertible bond"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalDilutionCreateConvertibleNoteOp
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: converts-to-share-class-id
            type: uuid
            required: false
            lookup:
              table: share_classes
              entity_type: share_class
              schema: ob-poc
              search_key: name
              primary_key: id
          - name: holder-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: principal-amount
            type: decimal
            required: true
          - name: valuation-cap
            type: decimal
            required: false
          - name: discount-pct
            type: decimal
            required: false
          - name: expiration-date
            type: date
            required: true
        returns:
          type: uuid
          name: instrument_id
          capture: true
        produces:
          type: dilution_instrument

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.exercise:
        flavour: attribute_mutating
        description: Exercise options/warrants and convert to shares
        effect_class: read_modify_write
        invocation_phrases:
          - "exercise options"
          - "exercise warrant"
          - "convert options to shares"
          - "exercise dilution instrument"
          - "option exercise"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalDilutionExerciseOp
        args:
          - name: instrument-id
            type: uuid
            required: true
            lookup:
              table: dilution_instruments
              entity_type: instrument
              schema: ob-poc
              search_key: instrument_id
              primary_key: instrument_id
          - name: units
            type: decimal
            required: true
            description: Number of instruments to exercise
          - name: exercise-date
            type: date
            required: false
          - name: is-cashless
            type: boolean
            required: false
            default: false
            description: Cashless/net exercise (shares withheld for cost)
        returns:
          type: uuid
          name: exercise_id
          capture: true
        produces:
          type: dilution_exercise_event

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.forfeit:
        flavour: attribute_mutating
        description: Forfeit/cancel unvested or unexercised instruments
        effect_class: read_modify_write
        invocation_phrases:
          - "forfeit options"
          - "cancel vested options"
          - "forfeit warrants"
          - "expire unexercised options"
          - "option forfeiture"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: plugin
        plugin:
          handler: CapitalDilutionForfeitOp
        args:
          - name: instrument-id
            type: uuid
            required: true
            lookup:
              table: dilution_instruments
              entity_type: instrument
              schema: ob-poc
              search_key: instrument_id
              primary_key: instrument_id
          - name: units
            type: decimal
            required: true
          - name: reason
            type: string
            required: false
        returns:
          type: affected

        three_axis:
          state_effect: preserving
          external_effects: *id001
          consequence:
            baseline: requires_confirmation
      dilution.list:
        flavour: attribute_mutating
        description: List dilution instruments for an issuer
        effect_class: read_snapshot
        invocation_phrases:
          - "list dilution instruments"
          - "show options and warrants"
          - "list outstanding options"
          - "show dilution schedule"
          - "get dilution instruments"
        metadata:
          tier: reference
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: facts_only
        behavior: plugin
        plugin:
          handler: CapitalDilutionListOp
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: status
            type: string
            required: false
            default: "ACTIVE"
            validation:
              enum:
                - ACTIVE
                - EXERCISED
                - EXPIRED
                - FORFEITED
                - CANCELLED
                - ALL
          - name: instrument-type
            type: string
            required: false
            validation:
              enum:
                - STOCK_OPTION
                - WARRANT
                - CONVERTIBLE_NOTE
                - SAFE
                - RSU
                - ALL
        returns:
          type: record_set

        three_axis:
          state_effect: preserving
          external_effects:
            - observational
          consequence:
            baseline: benign
      dilution.get-summary:
        flavour: attribute_mutating
        description: Get dilution summary for an issuer
        effect_class: read_snapshot
        invocation_phrases:
          - "dilution summary"
          - "show dilution impact"
          - "get dilution overview"
          - "fully diluted summary"
          - "dilution analysis"
          - "what's the dilution on this entity"
          - "how diluted is the cap table"
          - "show me the option pool impact"
        metadata:
          tier: reference
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: facts_only
        behavior: plugin
        plugin:
          handler: CapitalDilutionGetSummaryOp
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
        returns:
          type: record

      # --------------------------------------------------------------------------
      # Control Configuration
      # --------------------------------------------------------------------------

        three_axis:
          state_effect: preserving
          external_effects:
            - observational
          consequence:
            baseline: benign
      control-config.set:
        flavour: attribute_mutating
        description: Set control thresholds for an issuer
        effect_class: idempotent_ensure
        invocation_phrases:
          - "set control configuration"
          - "configure control thresholds"
          - "set ownership control rules"
          - "update control config"
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          phase_tags: [onboarding]
          side_effects: state_write
        behavior: crud
        crud:
          operation: upsert
          table: issuer_control_config
          schema: ob-poc
          returning: config_id
          conflict_keys:
            - issuer_entity_id
            - effective_from
        args:
          - name: issuer-entity-id
            type: uuid
            required: true
            maps_to: issuer_entity_id
            lookup:
              table: entities
              schema: ob-poc
              entity_type: entity
              search_key: name
              primary_key: entity_id
          - name: control-threshold-pct
            type: decimal
            required: false
            default: "50"
            maps_to: control_threshold_pct
          - name: significant-threshold-pct
            type: decimal
            required: false
            default: "25"
            maps_to: significant_threshold_pct
          - name: material-threshold-pct
            type: decimal
            required: false
            default: "10"
            maps_to: material_threshold_pct
          - name: disclosure-threshold-pct
            type: decimal
            required: false
            default: "5"
            maps_to: disclosure_threshold_pct
          - name: control-basis
            type: string
            required: false
            default: "VOTES"
            maps_to: control_basis
            validation:
              enum:
                - VOTES
                - ECONOMIC
                - UNITS
          - name: voting-basis
            type: string
            required: false
            default: "OUTSTANDING"
            maps_to: voting_basis
            validation:
              enum:
                - ISSUED
                - OUTSTANDING
                - FULLY_DILUTED
                - EXERCISABLE
          - name: jurisdiction
            type: string
            required: false
            maps_to: jurisdiction
          - name: effective-from
            type: date
            required: false
            maps_to: effective_from
        defaults:
          effective_from: CURRENT_DATE
        returns:
          type: uuid
          name: config_id
          capture: true

        three_axis:
          state_effect: preserving
          external_effects: []
