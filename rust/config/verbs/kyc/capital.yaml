domains:
  capital:
    description: |
      Corporate capital structure management - extends Clearstream-style registry.
      Wraps share-class and holding verbs with corporate-specific semantics.
      Enforces reconciliation: SUM(holdings) = issued_shares.

    verbs:
      allocate:
        flavour: attribute_mutating
        description: |
          Allocate shares to a shareholder. Creates holding record.
          Validates total allocations don't exceed issued_shares.
        effect_class: idempotent_ensure
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          tags: [kyc]
          phase_tags: [onboarding]
          side_effects: state_write
        invocation_phrases:
        - "allocate shares to shareholder"
        - "assign share holding"
        - "record beneficial ownership stake"
        - "give shares to entity"
        - "create shareholder holding record"
        - "register share allocation"
        - "add shares to PSC register"
        - "record equity ownership"
        behavior: crud
        crud:
          operation: upsert
          table: holdings
          schema: ob-poc
          returning: id
          conflict_keys:
          - share_class_id
          - investor_entity_id
        args:
        - name: share-class-id
          type: uuid
          required: true
          maps_to: share_class_id
          lookup:
            table: share_classes
            entity_type: share_class
            schema: ob-poc
            search_key: name
            primary_key: id
        - name: shareholder-entity-id
          type: uuid
          required: true
          maps_to: investor_entity_id
          lookup:
            table: entities
            entity_type: entity
            schema: ob-poc
            search_key: name
            primary_key: entity_id
        - name: units
          type: decimal
          required: true
          maps_to: units
        - name: acquisition-date
          type: date
          required: false
          maps_to: acquisition_date
        - name: cost-basis
          type: decimal
          required: false
          maps_to: cost_basis
        set_values:
          status: active
        returns:
          type: uuid
          name: holding_id
          capture: true
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      transfer:
        flavour: attribute_mutating
        description: Transfer shares between shareholders (creates movement records)
        effect_class: read_modify_write
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          tags: [kyc]
          phase_tags: [onboarding]
          side_effects: state_write
        invocation_phrases:
        - "transfer shares between holders"
        - "record share transfer"
        - "move shares to new owner"
        - "change of ownership on register"
        - "log equity transfer"
        - "process share sale transaction"
        - "register share movement"
        - "update beneficial owner after transfer"
        behavior: plugin
        plugin:
          handler: CapitalTransferOp
        args:
        - name: share-class-id
          type: uuid
          required: true
          lookup:
            table: share_classes
            entity_type: share_class
            schema: ob-poc
            search_key: name
            primary_key: id
        - name: from-entity-id
          type: uuid
          required: true
          lookup:
            table: entities
            entity_type: entity
            schema: ob-poc
            search_key: name
            primary_key: entity_id
        - name: to-entity-id
          type: uuid
          required: true
          lookup:
            table: entities
            entity_type: entity
            schema: ob-poc
            search_key: name
            primary_key: entity_id
        - name: units
          type: decimal
          required: true
        - name: transfer-date
          type: date
          required: true
        - name: price-per-unit
          type: decimal
          required: false
        - name: reference
          type: string
          required: true
        returns:
          type: uuid
          name: transfer_id
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      reconcile:
        flavour: attribute_mutating
        description: |
          Verify capital structure reconciliation:
          - SUM(holdings.units) = issued_shares
          - All shareholders have verified identity
          Returns ownership% and voting% for each holder.
        effect_class: read_modify_write
        metadata:
          tier: intent
          source_of_truth: register
          scope: cbu
          noun: capital
          tags: [kyc]
          phase_tags: [onboarding]
          side_effects: state_write
        invocation_phrases:
        - "reconcile capital structure"
        - "verify shareholding totals"
        - "check ownership percentages match"
        - "validate share register integrity"
        - "do holdings add up"
        - "run capital reconciliation check"
        - "confirm issued shares match allocated"
        - "audit share class balances"
        behavior: plugin
        plugin:
          handler: CapitalReconcileOp
        args:
        - name: entity-id
          type: uuid
          required: true
          description: The issuing entity to reconcile
          lookup:
            table: entities
            entity_type: entity
            schema: ob-poc
            search_key: name
            primary_key: entity_id
        returns:
          type: record
          fields:
          - name: is_reconciled
            type: boolean
          - name: issued_shares
            type: integer
          - name: allocated_shares
            type: integer
          - name: unallocated_shares
            type: integer
          - name: shareholders
            type: array
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      get-ownership-chain:
        flavour: attribute_mutating
        description: |
          Traverse ownership upward from entity to all terminus points.
          Computes indirect ownership percentages multiplicatively.
        effect_class: read_snapshot
        metadata:
          tier: reference
          source_of_truth: register
          scope: cbu
          noun: capital
          tags: [kyc]
          phase_tags: [onboarding]
          side_effects: facts_only
        invocation_phrases:
        - "trace ownership chain upward"
        - "get UBO ownership path"
        - "show beneficial ownership chain"
        - "compute indirect ownership percentage"
        - "follow ownership to ultimate parent"
        - "who ultimately owns this entity"
        - "traverse equity control chain"
        - "map ownership hierarchy for CDD"
        behavior: plugin
        plugin:
          handler: CapitalOwnershipChainOp
        args:
        - name: entity-id
          type: uuid
          required: true
          lookup:
            table: entities
            entity_type: entity
            schema: ob-poc
            search_key: name
            primary_key: entity_id
        - name: min-ownership-pct
          type: decimal
          required: false
          default: 0.01
          description: Minimum ownership % to include in chain
        returns:
          type: record_set
          description: Array of ownership paths with computed indirect %
        three_axis:
          state_effect: preserving
          external_effects: [observational]
          consequence:
            baseline: benign

      # issue-shares deleted 2026-08-19 (EOP-PLAN capital/share-class
      # consolidation): its CapitalIssueSharesOp referenced
      # share_classes.issued_shares/authorized_shares, neither of which
      # exists live -- would have errored at runtime, and it bypassed the
      # issuance_events ledger entirely unlike issue.initial/issue.new
      # (config/verbs/capital.yaml), which are the real issuance path.

      # cancel-shares deleted 2026-08-19 (EOP-PLAN share-register board
      # design pass): its CapitalCancelSharesOp referenced
      # share_classes.issued_shares, which doesn't exist live -- would
      # have errored at runtime -- and duplicated capital.cancel
      # (config/verbs/capital.yaml), which already does the same job
      # correctly via the real issuance_events/share_class_supply path.

      list-by-issuer:
        flavour: attribute_mutating
        description: List all share classes for an issuing entity
        effect_class: read_snapshot
        metadata:
          tier: reference
          source_of_truth: register
          scope: cbu
          noun: capital
          tags: [kyc]
          phase_tags: [onboarding]
          side_effects: facts_only
        invocation_phrases:
        - "list share classes for issuer"
        - "show capital structure"
        - "get all share types"
        - "display company equity classes"
        - "view share register summary"
        - "show authorized share classes"
        - "list voting and non-voting shares"
        behavior: crud
        crud:
          operation: list_by_fk
          table: share_classes
          schema: ob-poc
          fk_col: issuer_entity_id
        args:
        - name: issuer-entity-id
          type: uuid
          required: true
          lookup:
            table: entities
            entity_type: entity
            schema: ob-poc
            search_key: name
            primary_key: entity_id
        returns:
          type: record_set
        three_axis:
          state_effect: preserving
          external_effects: [observational]
          consequence:
            baseline: benign

      list-shareholders:
        flavour: attribute_mutating
        description: List all shareholders for a share class
        effect_class: read_snapshot
        metadata:
          tier: reference
          source_of_truth: register
          scope: cbu
          noun: capital
          tags: [kyc]
          phase_tags: [onboarding]
          side_effects: facts_only
        invocation_phrases:
        - "list shareholders for class"
        - "show PSC register entries"
        - "who holds these shares"
        - "get beneficial owners of shares"
        - "display shareholder register"
        - "view share ownership breakdown"
        - "show holders for equity class"
        - "list persons with significant control"
        behavior: crud
        crud:
          operation: list_by_fk
          table: holdings
          schema: ob-poc
          fk_col: share_class_id
        args:
        - name: share-class-id
          type: uuid
          required: true
          lookup:
            table: share_classes
            entity_type: share_class
            schema: ob-poc
            search_key: name
            primary_key: id
        - name: include-inactive
          type: boolean
          required: false
          default: false
        returns:
          type: record_set
        three_axis:
          state_effect: preserving
          external_effects: [observational]
          consequence:
            baseline: benign
