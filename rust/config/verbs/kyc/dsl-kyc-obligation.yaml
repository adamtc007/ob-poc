domains:
  # `kyc_ubo.assert.obligation` domain RETIRED (EOP-DD-KYCUBO-D2.0 §5, K-G7,
  # 2026-08-22): `creation`/`satisfaction` DISSOLVED — "nobody hands over an
  # obligation; you run the checks and they fail. The finding is the
  # record." / "nothing is satisfied; you assert the missing fact and
  # re-run. The new run supersedes the old." `waiver` MOVED to
  # `kyc_ubo.decide.obligation.waiver`, below (the one genuine act among the
  # three: a human rules that a failing check does not apply, with reason
  # and authority, citing the run — an Evaluation decision, never a
  # fact-stream append). role.assign/role.withdraw were already retired
  # 2026-08-12 (T0.3 K-G7, fold-blind write) from this same domain.
  # Reintroduction path for creation/satisfaction: none named — the run book
  # (D2.0 §4) replaces this capability entirely, not a future verb.

  # ── TS.6 §3 relocation (2026-08-22) ────────────────────────────────────
  # `kyc_ubo.assert.entity.screening` / `kyc_ubo.assert.entity.identity` / `kyc_ubo.assert.entity.risk` were
  # `kyc.obligation.update-{screening,identity,risk}` (their pre-TS.6 names) until TS.6 §3's
  # ratified relocation: they are Assembly FACTS ("someone handed us a
  # screening result / an identity verification / a risk rating"), not
  # work-item updates on an obligation. Filing them in the obligation
  # namespace is what made their purpose read as unclear. They keep their
  # fold behaviour and their place in assembly_lexicon() exactly; only the
  # namespace moves. Sibling of the `decide:` evaluation namespace below —
  # the assert/assess/decide scheme named in TS.6's v0.1-0.2 change log.
  kyc_ubo.assert.entity:
    description: "Assembly facts about an entity — observations someone handed us about the world (TS.6 §3)"

    verbs:
      screening:
        flavour: attribute_mutating
        description: Advance the screening track of an obligation (K-26 — screening
          gates approval, not determination)
        effect_class: append_fact
        invocation_phrases:
        - update screening track
        - record screening outcome
        - advance screening track
        - mark screening complete
        - update obligation screening
        - record screening result for obligation
        - advance the screening track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - screening
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose screening track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      identity:
        flavour: attribute_mutating
        description: Advance the identity verification track of an obligation
        effect_class: append_fact
        invocation_phrases:
        - update identity track
        - advance identity verification
        - record identity outcome
        - mark identity verified
        - update identity verification
        - record identity verification result
        - advance identity track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - identity
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose identity track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
          description: Reason (required if state=waived)
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      risk:
        flavour: attribute_mutating
        description: Advance the risk-assessment track of an obligation
        effect_class: append_fact
        invocation_phrases:
        - update risk track
        - record risk outcome
        - advance risk assessment
        - mark risk assessment complete
        - update obligation risk
        - record risk assessment result
        - advance the risk track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - risk
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose risk track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

  kyc_ubo.decide.subject:
    description: KYC Evaluation-pack verdicts (EOP-DD-KYCUBO-TS.6 §1/§4) — deciding
      is what this pack is for. Writes only to kyc_decision_records, never the
      dsl.kyc fact stream (ob-poc-kyc-decide has no dependency on ob-poc-kyc-seam,
      the sole fact-stream append chokepoint).
    verbs:
      approve:
        flavour: attribute_mutating
        description: Approve a subject once all obligations are terminal (K-23 gate).
          Writes only to kyc_decision_records — never the fact stream.
        effect_class: append_fact
        invocation_phrases:
        - approve person
        - approve subject
        - approve KYC subject
        - grant KYC approval
        - approve this person for KYC
        - approve the subject
        - KYC approve
        - mark subject approved
        - grant approval for this subject
        - approve KYC
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_subject
          tags:
          - kyc
          - decide
          - approval
          - decision
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject to approve
        returns:
          type: record
          fields:
          - name: decision_id
            type: uuid
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      reject:
        flavour: attribute_mutating
        description: Reject a subject (K-23 — decision recorded in kyc_decision_records,
          never the fact stream, never erased)
        effect_class: append_fact
        invocation_phrases:
        - reject person
        - reject subject
        - reject KYC subject
        - refuse KYC approval
        - reject this person
        - KYC reject
        - mark subject rejected
        - record KYC rejection
        - reject the KYC application
        - decline KYC approval
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_subject
          tags:
          - kyc
          - decide
          - rejection
          - decision
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject to reject
        - name: reason
          type: string
          required: false
          description: Reason for rejection
        returns:
          type: record
          fields:
          - name: decision_id
            type: uuid
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

  kyc_ubo.decide.obligation:
    description: KYC Evaluation-pack obligation waiver (D2.0 §5, moved from
      kyc_ubo.assert.obligation.waiver 2026-08-22) — a human ruling that a
      failing check does not apply, citing the run. Writes only to
      kyc_decision_records, never the dsl.kyc fact stream.
    verbs:
      waiver:
        flavour: attribute_mutating
        description: Waive a failing check for a subject, citing the run and the
          reason and authority for the waiver (D2.0 §5). Writes only to
          kyc_decision_records — never the fact stream.
        effect_class: append_fact
        invocation_phrases:
        - waive obligation
        - waive KYC obligation
        - grant obligation waiver
        - waive this obligation
        - grant a waiver for this obligation
        - record obligation waiver
        - waive this check
        - grant a waiver for this check
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - decide
          - obligation
          - waive
          - decision
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject the waiver applies to
        - name: check-id
          type: string
          required: true
          description: The check being waived, citing the run it was evaluated in
        - name: reason
          type: string
          required: true
          description: Reason and authority for the waiver (K-35 traceability)
        returns:
          type: record
          fields:
          - name: decision_id
            type: uuid
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
