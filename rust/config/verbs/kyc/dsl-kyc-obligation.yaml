domains:
  kyc_ubo.assert.obligation:
    description: KYC obligation graph — role-basis recording (W3) and obligation
      lifecycle (W5). Assembly pack.
    verbs:
      # role.assign / role.withdraw retired 2026-08-12 (T0.3 K-G7 — fold-blind
      # write: declared effect_class: append_fact / side_effects: state_write,
      # registered and live, but zero match arm in apply_one_control_event or
      # apply_one_obligation_event; events appended and were permanently
      # invisible to every fold/projection/query — same defect signature as
      # the already-remediated ubo.board-controller.override, 2026-07-15).
      # K-21 explicitness is already fully met at obligation.create's required
      # `role` arg. Reintroduction path (if T6 wants basis-before-obligation
      # as enforced stud geometry): role.assign returns deliberately, with a
      # precondition attached from birth — never bare again.
      creation:
        flavour: instance_adding
        description: Create an obligation for a subject under a stated role basis
          (K-21, K-35)
        effect_class: append_fact
        invocation_phrases:
        - create obligation
        - create KYC obligation
        - open obligation
        - raise obligation
        - create a KYC obligation for this subject
        - open an obligation track
        - record new obligation
        - raise a KYC obligation
        - create identity obligation
        - open an obligation for this person
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject for whom the obligation is raised
        - name: obligation-id
          type: uuid
          required: false
          description: Stable obligation identity (generated if omitted)
        - name: role
          type: string
          required: true
          description: Role that triggered this obligation (K-21)
        - name: jurisdiction
          type: string
          required: false
          description: Jurisdiction driving the requirement
        - name: cbu-role
          type: string
          required: false
          description: CBU/Deal role linking to exposure (K-24)
        returns:
          type: record
          fields:
          - name: obligation_id
            type: uuid
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      satisfaction:
        flavour: attribute_mutating
        description: Mark all tracks on an obligation as satisfied (full KYC clearance)
        effect_class: append_fact
        invocation_phrases:
        - satisfy obligation
        - mark obligation satisfied
        - complete obligation
        - satisfy all tracks
        - clear obligation
        - mark this obligation as satisfied
        - complete KYC obligation
        - satisfy the obligation tracks
        - all tracks satisfied
        - close obligation as satisfied
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - satisfy
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation to satisfy
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      waiver:
        flavour: attribute_mutating
        description: Waive an obligation (all tracks set to Waived with a recorded
          reason)
        effect_class: append_fact
        invocation_phrases:
        - waive obligation
        - waive KYC obligation
        - grant obligation waiver
        - waive all tracks
        - waive this obligation
        - grant a waiver for this obligation
        - record obligation waiver
        - waive the obligation tracks
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - waive
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation to waive
        - name: reason
          type: string
          required: true
          description: Reason for the waiver (K-35 traceability)
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      # person.approve/person.reject RETIRED from this domain TS.6 P2
      # (K-G7) — renamed kyc_ubo.decide.subject.approve/kyc_ubo.decide.subject.reject and moved to the new
      # `decide:` domain below (structural Evaluation-pack split,
      # EOP-DD-KYCUBO-TS.6 §1: writes only to kyc_decision_records via
      # ob-poc-kyc-decide, which has no dependency on ob-poc-kyc-seam, so it
      # never reaches the fact stream).

  # ── TS.6 §3 relocation (2026-08-22) ────────────────────────────────────
  # `kyc_ubo.assert.entity.screening` / `kyc_ubo.assert.entity.identity` / `kyc_ubo.assert.entity.risk` were
  # `kyc.obligation.update-{screening,identity,risk}` (their pre-TS.6 names) until TS.6 §3's
  # ratified relocation: they are Assembly FACTS ("someone handed us a
  # screening result / an identity verification / a risk rating"), not
  # work-item updates on an obligation. Filing them in the obligation
  # namespace is what made their purpose read as unclear. They keep their
  # fold behaviour and their place in assembly_lexicon() exactly; only the
  # namespace moves. Sibling of the `decide:` evaluation namespace below —
  # the assert/assess/decide scheme named in TS.6's v0.1-0.2 change log.
  kyc_ubo.assert.entity:
    description: "Assembly facts about an entity — observations someone handed us about the world (TS.6 §3)"

    verbs:
      screening:
        flavour: attribute_mutating
        description: Advance the screening track of an obligation (K-26 — screening
          gates approval, not determination)
        effect_class: append_fact
        invocation_phrases:
        - update screening track
        - record screening outcome
        - advance screening track
        - mark screening complete
        - update obligation screening
        - record screening result for obligation
        - advance the screening track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - screening
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose screening track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      identity:
        flavour: attribute_mutating
        description: Advance the identity verification track of an obligation
        effect_class: append_fact
        invocation_phrases:
        - update identity track
        - advance identity verification
        - record identity outcome
        - mark identity verified
        - update identity verification
        - record identity verification result
        - advance identity track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - identity
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose identity track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
          description: Reason (required if state=waived)
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      risk:
        flavour: attribute_mutating
        description: Advance the risk-assessment track of an obligation
        effect_class: append_fact
        invocation_phrases:
        - update risk track
        - record risk outcome
        - advance risk assessment
        - mark risk assessment complete
        - update obligation risk
        - record risk assessment result
        - advance the risk track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - risk
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose risk track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

  kyc_ubo.decide.subject:
    description: KYC Evaluation-pack verdicts (EOP-DD-KYCUBO-TS.6 §1/§4) — deciding
      is what this pack is for. Writes only to kyc_decision_records, never the
      dsl.kyc fact stream (ob-poc-kyc-decide has no dependency on ob-poc-kyc-seam,
      the sole fact-stream append chokepoint).
    verbs:
      approve:
        flavour: attribute_mutating
        description: Approve a subject once all obligations are terminal (K-23 gate).
          Writes only to kyc_decision_records — never the fact stream.
        effect_class: append_fact
        invocation_phrases:
        - approve person
        - approve subject
        - approve KYC subject
        - grant KYC approval
        - approve this person for KYC
        - approve the subject
        - KYC approve
        - mark subject approved
        - grant approval for this subject
        - approve KYC
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_subject
          tags:
          - kyc
          - decide
          - approval
          - decision
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject to approve
        returns:
          type: record
          fields:
          - name: decision_id
            type: uuid
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      reject:
        flavour: attribute_mutating
        description: Reject a subject (K-23 — decision recorded in kyc_decision_records,
          never the fact stream, never erased)
        effect_class: append_fact
        invocation_phrases:
        - reject person
        - reject subject
        - reject KYC subject
        - refuse KYC approval
        - reject this person
        - KYC reject
        - mark subject rejected
        - record KYC rejection
        - reject the KYC application
        - decline KYC approval
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_subject
          tags:
          - kyc
          - decide
          - rejection
          - decision
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject to reject
        - name: reason
          type: string
          required: false
          description: Reason for rejection
        returns:
          type: record
          fields:
          - name: decision_id
            type: uuid
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
