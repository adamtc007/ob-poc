domains:
  kyc:
    description: KYC obligation graph — role-basis recording (W3) and obligation lifecycle
      (W5)
    verbs:
      # role.assign / role.withdraw retired 2026-08-12 (T0.3 K-G7 — fold-blind
      # write: declared effect_class: append_fact / side_effects: state_write,
      # registered and live, but zero match arm in apply_one_control_event or
      # apply_one_obligation_event; events appended and were permanently
      # invisible to every fold/projection/query — same defect signature as
      # the already-remediated ubo.board-controller.override, 2026-07-15).
      # K-21 explicitness is already fully met at obligation.create's required
      # `role` arg. Reintroduction path (if T6 wants basis-before-obligation
      # as enforced stud geometry): role.assign returns deliberately, with a
      # precondition attached from birth — never bare again.
      obligation.create:
        flavour: instance_adding
        description: Create an obligation for a subject under a stated role basis
          (K-21, K-35)
        effect_class: append_fact
        invocation_phrases:
        - create obligation
        - create KYC obligation
        - open obligation
        - raise obligation
        - create a KYC obligation for this subject
        - open an obligation track
        - record new obligation
        - raise a KYC obligation
        - create identity obligation
        - open an obligation for this person
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject for whom the obligation is raised
        - name: obligation-id
          type: uuid
          required: false
          description: Stable obligation identity (generated if omitted)
        - name: role
          type: string
          required: true
          description: Role that triggered this obligation (K-21)
        - name: jurisdiction
          type: string
          required: false
          description: Jurisdiction driving the requirement
        - name: cbu-role
          type: string
          required: false
          description: CBU/Deal role linking to exposure (K-24)
        returns:
          type: record
          fields:
          - name: obligation_id
            type: uuid
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      obligation.update-identity:
        flavour: attribute_mutating
        description: Advance the identity verification track of an obligation
        effect_class: append_fact
        invocation_phrases:
        - update identity track
        - advance identity verification
        - record identity outcome
        - mark identity verified
        - update identity verification
        - record identity verification result
        - advance identity track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - identity
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose identity track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
          description: Reason (required if state=waived)
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      obligation.update-screening:
        flavour: attribute_mutating
        description: Advance the screening track of an obligation (K-26 — screening
          gates approval, not determination)
        effect_class: append_fact
        invocation_phrases:
        - update screening track
        - record screening outcome
        - advance screening track
        - mark screening complete
        - update obligation screening
        - record screening result for obligation
        - advance the screening track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - screening
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose screening track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      obligation.update-risk:
        flavour: attribute_mutating
        description: Advance the risk-assessment track of an obligation
        effect_class: append_fact
        invocation_phrases:
        - update risk track
        - record risk outcome
        - advance risk assessment
        - mark risk assessment complete
        - update obligation risk
        - record risk assessment result
        - advance the risk track
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - risk
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation whose risk track to advance
        - name: state
          type: string
          required: true
          description: 'One of: in_progress, satisfied, waived, deferred, expired,
            rejected'
          valid_values: [in_progress, satisfied, waived, deferred, expired, rejected]
        - name: reason
          type: string
          required: false
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      obligation.satisfy:
        flavour: attribute_mutating
        description: Mark all tracks on an obligation as satisfied (full KYC clearance)
        effect_class: append_fact
        invocation_phrases:
        - satisfy obligation
        - mark obligation satisfied
        - complete obligation
        - satisfy all tracks
        - clear obligation
        - mark this obligation as satisfied
        - complete KYC obligation
        - satisfy the obligation tracks
        - all tracks satisfied
        - close obligation as satisfied
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - satisfy
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation to satisfy
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      obligation.waive:
        flavour: attribute_mutating
        description: Waive an obligation (all tracks set to Waived with a recorded
          reason)
        effect_class: append_fact
        invocation_phrases:
        - waive obligation
        - waive KYC obligation
        - grant obligation waiver
        - waive all tracks
        - waive this obligation
        - grant a waiver for this obligation
        - record obligation waiver
        - waive the obligation tracks
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_obligation
          tags:
          - kyc
          - obligation
          - waive
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: Subject stream to append this obligation event to
        - name: obligation-id
          type: uuid
          required: true
          description: The obligation to waive
        - name: reason
          type: string
          required: true
          description: Reason for the waiver (K-35 traceability)
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      person.approve:
        flavour: attribute_mutating
        description: Approve a subject once all obligations are terminal (K-23 gate)
        effect_class: append_fact
        invocation_phrases:
        - approve person
        - approve subject
        - approve KYC subject
        - grant KYC approval
        - approve this person for KYC
        - approve the subject
        - KYC approve
        - mark subject approved
        - grant approval for this subject
        - approve KYC
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_subject
          tags:
          - kyc
          - person
          - approval
          - decision
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject to approve
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
      person.reject:
        flavour: attribute_mutating
        description: Reject a subject (K-23 — decision recorded on the stream, never
          erased)
        effect_class: append_fact
        invocation_phrases:
        - reject person
        - reject subject
        - reject KYC subject
        - refuse KYC approval
        - reject this person
        - KYC reject
        - mark subject rejected
        - record KYC rejection
        - reject the KYC application
        - decline KYC approval
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: workflow
          scope: global
          noun: kyc_subject
          tags:
          - kyc
          - person
          - rejection
          - decision
          - w5
          - dsl-kyc
          phase_tags:
          - kyc
          side_effects: state_write
        args:
        - name: subject-id
          type: uuid
          required: true
          description: The subject to reject
        - name: reason
          type: string
          required: false
          description: Reason for rejection
        returns:
          type: record
          fields:
          - name: seq
            type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
