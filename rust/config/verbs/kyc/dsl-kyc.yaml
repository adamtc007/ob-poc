      edge.pierce-nominee:
        flavour: attribute_mutating
        description: Pierce a nominee arrangement — supersede the nominee edge and assert the disclosed nominator's underlying edge in one governed event (K-8, K-13)
        effect_class: append_fact
        invocation_phrases:
          - "pierce nominee"
          - "pierce the nominee edge"
          - "pierce this nominee arrangement"
          - "disclose the nominator"
          - "look through the nominee"
          - "pierce nominee shareholding"
          - "replace nominee with true holder"
          - "record the disclosed nominator"
          - "pierce the nominee to the beneficial holder"
          - "unwind the nominee arrangement"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: control_edge
          tags: [ubo, nominee, pierce, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root (the subject stream)
          - name: edge-id
            type: uuid
            required: true
            description: The target nominee edge to pierce (must exist, be active, and be of kind nominee — the kind check is op-layer fail-closed; EdgeExists/EdgeActive are lexicon preconditions)
          - name: nominator-id
            type: uuid
            required: true
            description: The disclosed nominator — the entity that actually holds the underlying interest; the new control edge is asserted FROM this entity with pierced_from provenance (TS.4 §2.6)
          - name: kind
            type: string
            required: true
            description: "The UNDERLYING kind the nominator actually holds (what the pierced arrangement resolves to). Any canonical wire value EXCEPT nominee — a pierce cannot produce another nominee edge (fail-closed at the op-normalizer, TS.4 §2.6). The new edge's id derives from the assert-control scheme with this kind."
            valid_values: [voting_rights, board_appointment, gp_statutory, designated_member, trust_settlor, trust_trustee, trust_protector, trust_beneficiary, dominant_influence, economic_interest]
          - name: percentage
            type: decimal
            required: false
            description: Percentage (for an underlying economic_interest kind)
          - name: trust-revocable
            type: boolean
            required: false
            description: "Whether the trust IS revocable — only meaningful when the underlying kind is trust_settlor (same polarity as assert-control's trust-revocable, TS.1 §2.1)"
        returns:
          type: record
          fields:
            - name: pierced_edge_id
              type: uuid
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

