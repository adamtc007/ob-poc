# dsl.kyc — the V&S determination vocabulary (EOP-VS-KYCUBO-001 / EOP-DD-KYCUBO-002).
#
# These are the REPLACEMENT verbs for the legacy ubo.*/control.*/ownership.*/board.* write
# verbs. Every verb here is STREAM-BACKED: it appends an IntentEvent to the durable
# kyc_intent_events stream; current state is a fold/projection of that stream — never a
# direct table write. Ops live in domain_ops::kyc_stream_ops.
#
# The domain split (four-segment scheme `kyc_ubo.<capability>.<domain>.<intent>`,
# RATIFIED 2026-08-22): kyc_ubo.assert.edge.* (4 edge lifecycle as of T3,
# EOP-VS-UBO-GAME-001, 2026-08-27 — connect/evidence/verification/disconnect;
# connect merges the former control+economic-interest, disconnect renames
# supersession, reconciliation is retired outright (§3.3); nominee-piercing
# retired as a standalone verb TS.6 P2 — folded into a macro composing
# assert.edge.connect's pierced-from arg + assert.edge.disconnect, K-8),
# kyc_ubo.decide.determination.* (1: freeze — the single Assembly verdict;
# select-strategy/compute-fold/apply-smo-fallback all retired), and
# kyc_ubo.assert.subject.* (6 subject/entity lifecycle). All are covered by
# assembly_lexicon() in the ob-poc-kyc-substrate crate.
#
# Capability follows pack membership: Assembly verbs are `assert` except the
# pinned verdict set {freeze}; Evaluation verbs are `decide`. `assess` has no
# members yet. The intent segment is a NOUN, never a repeat of the capability.

domains:
  kyc_ubo.assert.edge:
    description: "UBO edge assertions — durable stream-backed verb primitives (dsl.kyc lexicon, Assembly pack)"

    verbs:
      connect:
        flavour: instance_adding
        description: "A link exists, from this block to that one, of this kind (EOP-VS-UBO-GAME-001 §3.1) — merges assert-control + assert-economic-interest (§3.2: they differ by kind, geometry already validates the classified pipe, their preconditions are identical). The system mints the link id and returns it (§8 Q3); a caller-supplied id is refused."
        effect_class: append_fact
        invocation_phrases:
          - "assert control"
          - "claim control edge"
          - "add control relationship"
          - "record control edge"
          - "assert voting control"
          - "declare board appointment control"
          - "record control over entity"
          - "assert this entity controls that one"
          - "add ownership and control edge"
          - "record a control relationship"
          - "assert controlling interest"
          - "claim a control relationship"
          - "add a control assertion"
          - "assert dominant influence"
          - "record GP statutory control"
          - "connect these two blocks"
          - "assert economic interest"
          - "record shareholding"
          - "add economic interest edge"
          - "claim economic interest"
          - "record ownership percentage"
          - "assert shareholding interest"
          - "add a shareholding"
          - "record economic stake"
          - "add ownership stake"
          - "assert beneficial interest"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: edge
          tags: [ubo, control, economic, ownership, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root (the subject stream)
          - name: from_entity_id
            type: uuid
            required: true
            description: The linking entity (controlling entity, or owning entity for an economic_interest kind)
          - name: to_entity_id
            type: uuid
            required: true
            description: The linked entity (controlled entity, or owned entity for an economic_interest kind)
          - name: kind
            type: string
            required: true
            description: "Link basis (fold::control::EdgeKind, payload key `kind` — control.rs::edge_kind_from_payload; canonical wire set: EDGE_KIND_WIRE_VALUES, TS.1 §1a). Trust roles are sub-kind-explicit: trust_settlor / trust_trustee / trust_protector / trust_beneficiary each map to their EdgeKind::TrustRole sub-kind, so distinct roles between the same (from,to) pair derive distinct edge ids and coexist under NoDuplicateActiveEdge. `economic_interest` is the former assert-economic-interest verb's sole implicit kind, now an explicit value alongside every control basis — one merged verb, geometry-validated the same way (§3.2: \"this merge passes the test\"). Unrecognized or omitted values are REJECTED at the op-normalizer before append (TS.1 §1b, fail-closed); the fold itself stays infallible — its dominant_influence catch-all remains only as the total-dispatch backstop for historical events."
            valid_values: [voting_rights, board_appointment, gp_statutory, designated_member, trust_settlor, trust_trustee, trust_protector, trust_beneficiary, nominee, dominant_influence, economic_interest, officer_appointment, management_mandate, membership_rights, statutory_authority, employment, containment]
          - name: percentage
            type: decimal
            required: false
            description: Percentage (for economic_interest edges)
          - name: trust-revocable
            type: boolean
            required: false
            description: "Whether the trust IS revocable — only meaningful on trust_settlor edges (TS.1 §2.1). Polarity: false = PROVEN irrevocable, the only value that excludes the settlor from trust_role_strategy candidates; true or absent both treat the trust as revocable, so the settlor is INCLUDED (fail-closed toward inclusion: over-identify, never silently drop a controller)."
          - name: pierced-from
            type: uuid
            required: false
            description: "TS.6 P2 (K-G7): set ONLY by the `kyc_ubo.assert.edge.nominee-piercing` macro (config/verb_schemas/macros/ubo.yaml), which composes this verb with edge.disconnect to replace the retired standalone pierce-nominee verb. The referenced edge id — the nominee edge this assertion pierces. Op-layer fail-closed check (no precondition primitive expresses \"edge is of kind X\"): the referenced edge must exist, be EdgeKind::Nominee, and be active. `kind` above may not be `nominee` when this is set (a pierce cannot produce another nominee edge). Fold-side: stamps EdgeState.pierced_from (K-8 traceability)."
        returns:
          type: record
          fields:
            - name: edge_id
              type: uuid
            - name: seq
              type: integer
            - name: deduped
              type: boolean
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      evidence:
        flavour: attribute_mutating
        description: >-
          Cite evidence for an asserted edge (moves edge from Asserted →
          Evidenced), OR cite evidence for an entity's asserted type (moves
          the type's proof from Alleged → Proved). Supply exactly one of
          edge-id / entity-id — never both, never neither.
        effect_class: append_fact
        invocation_phrases:
          - "attach evidence"
          - "cite evidence for edge"
          - "add evidence to edge"
          - "record evidence for ownership"
          - "attach document evidence"
          - "evidence this control edge"
          - "add proof to ownership"
          - "attach supporting evidence"
          - "cite evidence for this relationship"
          - "record evidence for control"
          - "prove this entity's type"
          - "attach evidence for this entity's type"
          - "cite evidence for entity type"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: control_edge
          tags: [ubo, evidence, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root
          - name: edge-id
            type: uuid
            required: false
            description: The edge to evidence. Mutually exclusive with entity-id.
          - name: entity-id
            type: uuid
            required: false
            description: The entity whose asserted type to evidence (proves it). Mutually exclusive with edge-id.
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      verification:
        flavour: attribute_mutating
        description: Verify an evidenced edge (moves Evidenced → Verified; requires evidence first)
        effect_class: append_fact
        invocation_phrases:
          - "verify edge"
          - "verify control edge"
          - "verify ownership"
          - "verify this edge"
          - "mark edge as verified"
          - "verify the control relationship"
          - "verify this ownership"
          - "verify economic interest"
          - "confirm and verify edge"
          - "verify the assertion"
          - "verify the UBO evidence"
          - "verify the UBO evidence is sufficient"
          - "is the evidence sufficient to verify this edge"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: control_edge
          tags: [ubo, verification, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root
          - name: edge-id
            type: uuid
            required: true
            description: The evidenced edge to verify
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      disconnect:
        flavour: attribute_mutating
        description: "That link is not on the board (EOP-VS-UBO-GAME-001 §3.1) — merges supersession (K-13 supersede-never-delete: the edge stays, status flips; R5, nothing is deleted)"
        effect_class: append_fact
        invocation_phrases:
          - "disconnect this link"
          - "remove this connection"
          - "supersede edge"
          - "supersede control edge"
          - "supersede this relationship"
          - "mark edge superseded"
          - "replace this edge"
          - "supersede ownership edge"
          - "retire this control edge"
          - "supersede the assertion"
          - "mark as superseded"
          - "this edge is superseded"
          - "reject this UBO allegation"
          - "reject as unsubstantiated"
          - "expire this UBO entry"
          - "expire this edge"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: edge
          tags: [ubo, supersede, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root
          - name: edge-id
            type: uuid
            required: true
            description: The link to disconnect (cannot be deleted per K-13 — R5, status flips only)
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      # edge.pierce-nominee RETIRED (TS.6 P2, K-G7, 2026-08-22): folded into
      # the `kyc_ubo.assert.edge.nominee-piercing` MACRO (config/verb_schemas/macros/
      # ubo.yaml) composing `edge.assert-control` (with its new optional
      # `pierced-from` arg, below) + `edge.disconnect`. Piercing records a
      # real handed-over fact, so it wasn't deleted outright (unlike
      # select-strategy/compute-fold) — it was redesigned because the old
      # shape was a bespoke single-purpose verb doing two governed effects
      # in one hand-rolled fold arm, with no reusable composition mechanism.

      # reconciliation RETIRED (EOP-VS-UBO-GAME-001 T3, §3.3, 2026-08-27) —
      # "No reconcile. Two conflicting assertions both stand, each with
      # provenance. Resolution is disconnect the one that is wrong, or
      # connect the one that is right. A third path to what two moves
      # already do is how vocabularies grow." (§7: "REMOVE — a third path
      # to disconnect the wrong one or connect the right one. Its one
      # declared argument is read by no fold arm.") K-G7 full deletion,
      # despite 2 real committed historical events (P0c census) — unlike
      # register/type/member-withdrawal (T2), whose effects are continued
      # by place/remove, reconciliation's sole effect (gating freeze via
      # ReconciledProjection/is_reconciled(), K-14) is dissolved as a
      # concept in the SAME tranche: nothing survives to read
      # `reconciliation_event_id` once the K-14 gate is gone, so keeping
      # the fold arm alive for those 2 historical events would write to a
      # field nothing ever reads again. Verb, fold arm, precondition, and
      # the K-14 gate on freeze are gone together; see fold/control.rs and
      # lexicon.rs for the same reasoning restated at each deletion site.

      # TS.6 §5 (K-G7, RATIFIED) - `determination.apply-smo-fallback`
      # RETIRED 2026-08-22. SMO is PULLED on exhaustion, never asserted -
      # `determination.rs` walks OfficerAppointment edges into the
      # frontier and emits Prong::SmoFallback candidates directly
      # (TS.3 §4a). This verb was a second, manual way to WRITE an
      # answer the traversal already computes, so it could contradict
      # it. Reintroduction path - only as a query/preview API, never
      # as a dsl.kyc fact-stream verb.
      #
      # NOTE for future editors: no comment line inside a `verbs:` block
      # may END with a colon. `kyc_pack_closure.rs::extract_verb_fqns` is a
      # naive 6-space-indent line scan and would read it as a verb key.

  kyc_ubo.assert.subject:
    description: "KYC subject stream assertions (dsl.kyc lexicon, Assembly pack)"

    verbs:
      place:
        flavour: instance_adding
        description: Put a group member on the board, in this slot, as this type — merges register + assert-type (EOP-VS-UBO-GAME-001 §3.2); place never carries update semantics, a currently-placed entity must be removed first (§8 Q1)
        effect_class: append_fact
        invocation_phrases:
          - "place this entity"
          - "place on the board"
          - "register kyc subject"
          - "create determination subject"
          - "register subject for KYC"
          - "open a subject stream"
          - "register entity for determination"
          - "assert entity type"
          - "this entity is a"
          - "type this entity"
          - "declare entity type"
          - "place this entity on the board as a"
          - "record what this entity is"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: kyc_subject
          tags: [kyc, subject, placement, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: The UUID that anchors the subject's stream
          - name: entity-id
            type: uuid
            required: false
            description: The entity being placed, if distinct from subject-id (defaults to subject-id) — lets one determination stream place the intermediate entities/persons in its own ownership chain (V&S §7.1)
          - name: entity-type
            type: string
            required: true
            description: "The entity's type (EOP-DD-KYCUBO-TS.0 §4 catalogue) — the argument that decides which links can reach this block (§3.2). Rejected fail-closed if outside the canonical wire set."
            valid_values: [natural_person, sole_trader, private_limited_company, public_listed_company, llc_us, general_partnership, limited_partnership, llp, oeic_icvc, sicav, unit_trust, forty_act_fund, lp_fund, umbrella_with_sub_funds, discretionary_trust, fixed_bare_trust, foundation, pension_scheme, cooperative_mutual, charity_not_for_profit, government_dept_statutory_corporation, sovereign_wealth_vehicle]
          - name: is_natural_person
            type: boolean
            required: false
            description: Whether the placed entity is a natural person
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      structure-class:
        flavour: attribute_mutating
        description: Classify the entity structure for determination purposes (simple, complex, fund, etc.)
        effect_class: append_fact
        invocation_phrases:
          - "classify structure"
          - "classify subject structure"
          - "set entity structure"
          - "classify this entity"
          - "classify for KYC"
          - "set structure classification"
          - "classify the ownership structure"
          - "set entity type for determination"
          - "classify structure type"
          - "set the structure class"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: kyc_subject
          tags: [kyc, subject, classification, structure, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root
          - name: structure-class
            type: string
            required: true
            description: "Structure class — drives ubo.determination strategy selection (K-4). private_company/multi_tier_holding/listed_entity typically pair with ownership_prong_strategy (economic %); lp_fund/llp typically pair with control_prong_strategy (GP statutory / designated member control edges, M4); trust pairs with trust_role_strategy (trust_settlor/trust_trustee/trust_protector/trust_beneficiary wire values, TS.1); investment_fund pairs with fund_control_strategy (manager control, TS.2); foundation pairs with foundation_council_strategy (council control, TS.2); state_owned pairs with state_owned_strategy (rare natural-person controller, else the SMO route, TS.3); cooperative pairs with cooperative_member_strategy (office-based control, never membership per se, TS.3); nominee pairs with nominee_pierce_strategy (pierce via kyc_ubo.assert.edge.nominee-piercing first, then the underlying structure resolves — freeze fail-closes while unpierced nominee edges remain, TS.4 = K-8). The taxonomy is fully served: all 11 classes have an implemented strategy."
            valid_values: [private_company, multi_tier_holding, listed_entity, lp_fund, llp, trust, foundation, investment_fund, state_owned, cooperative, nominee]
          - name: entity-id
            type: uuid
            required: false
            description: The entity being classified, if distinct from subject-id (defaults to subject-id)
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      # type-correction DISSOLVED (EOP-VS-UBO-GAME-001 T2, §8 Q1,
      # 2026-08-27) — correcting a type is `remove` then `place`, two
      # ordinary moves, never a superseding placement or a computed
      # cascade. 0 real committed events existed for this FQN before
      # deletion (K-G7 full deletion, not a fold-arm-kept retirement).

      remove:
        flavour: attribute_mutating
        description: Take a group member off the board (EOP-VS-UBO-GAME-001 §3.1/§3.2, absorbs member-withdrawal) — withdraws the placement, never the entity (§2); the entity remains a group member and can be placed again
        effect_class: append_fact
        invocation_phrases:
          - "withdraw group member"
          - "remove this entity from the group"
          - "remove this entity from the board"
          - "this entity is no longer a member"
          - "withdraw membership"
          - "the entity left the group"
          - "drop this entity from the board"
          - "take this entity off the board"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: group_member
          tags: [kyc, subject, membership, placement, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root
          - name: entity-id
            type: uuid
            required: true
            description: The group member entity being removed (must be currently placed)
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

      enquiry:
        flavour: attribute_mutating
        description: Record sources consulted and searches run (EOP-DD-KYCUBO-TS.1 §3 move 8) — completeness is a diligence assertion, never a proof (TS.0 §6.3)
        effect_class: append_fact
        invocation_phrases:
          - "record enquiry"
          - "log sources consulted"
          - "record the diligence search"
          - "record group completeness enquiry"
          - "log the searches run"
          - "record what sources were checked"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: enquiry_record
          tags: [kyc, subject, diligence, ts1, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root (the group)
          - name: sources-consulted
            type: string_list
            required: false
            description: Sources consulted during the enquiry (e.g. GLEIF, company registry)
          - name: searches-run
            type: string_list
            required: false
            description: Searches run during the enquiry
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

  kyc_ubo.decide.determination:
    description: "Determination disposition — freeze commits to the computed answer as the one of record (Assembly pack; the one Assembly verdict, TS.6 rename ruling 2026-08-22)"

    verbs:
      freeze:
        flavour: attribute_mutating
        description: Freeze (pin) the current determination — seals the K-18 DeterminationPin
        effect_class: append_fact
        invocation_phrases:
          - "freeze determination"
          - "pin determination"
          - "seal determination"
          - "freeze the UBO determination"
          - "pin the ownership determination"
          - "lock the determination"
          - "freeze and seal"
          - "commit determination"
          - "seal the UBO pin"
          - "freeze the result"
          - "approve the beneficial ownership determination"
          - "approve the UBO determination"
          - "approve this ownership determination"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: determination
          tags: [ubo, freeze, pin, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root to freeze
          - name: policy-version
            type: string
            required: true
            description: Policy version at freeze time
          - name: threshold-pct
            type: decimal
            required: false
            description: "UBO threshold in percentage points (K-6); defaults to 25.0 pending a governed per-jurisdiction reference-plane table (EOP-DD-KYCUBO-003 M1.4)"
        returns:
          type: record
          fields:
            - name: seq
              type: integer
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable
