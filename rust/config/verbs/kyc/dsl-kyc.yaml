        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root
          - name: strategy
            type: string
            required: true
            description: "DeterminationStrategy::name() to run at freeze — ownership_prong_strategy (economic %), control_prong_strategy (voting rights, board appointment, GP statutory, LLP designated member, dominant influence; M4), trust_role_strategy (trust-role control: trustee/protector always, settlor unless proven irrevocable, beneficiary never — TS.1), fund_control_strategy (corporate-form fund: control sits with the manager (ManCo/AIFM/GP-analog) asserted as dominant_influence/board_appointment, investors stay on the economic axis — TS.2), foundation_council_strategy (foundation: no owners by construction, control sits with the council — board_appointment + dominant_influence edges ONLY — TS.2), state_owned_strategy (state-owned: the controller is a state organ, so the terminal answer is usually SMO — the full control walk runs for the rare genuine natural-person controller, zero candidates legitimizes the existing apply-smo-fallback route — TS.3), and cooperative_member_strategy (cooperative: one-member-one-vote, membership per se never yields a UBO, control arises from office — voting_rights + board_appointment + dominant_influence edges ONLY — TS.3), and nominee_pierce_strategy (nominee: pierce first via ubo.edge.pierce-nominee, then the subject resolves by the UNDERLYING structure — a delegate to the control-prong walk; freeze hard-errors while any unpierced nominee edge remains active — TS.4 = K-8) are implemented. The strategy set is TOTAL: all 11 structure classes are served."
            valid_values: [ownership_prong_strategy, control_prong_strategy, trust_role_strategy, fund_control_strategy, foundation_council_strategy, state_owned_strategy, cooperative_member_strategy, nominee_pierce_strategy]
        returns:
