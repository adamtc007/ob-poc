# dsl.kyc — the V&S determination vocabulary (EOP-VS-KYCUBO-001 / EOP-DD-KYCUBO-002).
#
# These are the REPLACEMENT verbs for the legacy ubo.*/control.*/ownership.*/board.* write
# verbs. Every verb here is STREAM-BACKED: it appends an IntentEvent to the durable
# kyc_intent_events stream; current state is a fold/projection of that stream — never a
# direct table write. Ops live in domain_ops::kyc_stream_ops.
#
# The domain split: ubo.edge.* (7 edge lifecycle, incl. pierce-nominee — TS.4 = K-8),
# ubo.determination.* (4 fold/freeze), kyc.subject.* (2 subject registration). All are
# covered by phase1_lexicon() in the ob-poc-kyc-substrate crate.

domains:
  ubo:
    description: "UBO determination — durable stream-backed verb primitives (dsl.kyc lexicon)"

    verbs:
      edge.assert-control:
        flavour: instance_adding
        description: Claim a control edge (voting rights, board appointment, GP statutory, trust role, etc.)
        effect_class: append_fact
        invocation_phrases:
          - "assert control"
          - "claim control edge"
          - "add control relationship"
          - "record control edge"
          - "assert voting control"
          - "declare board appointment control"
          - "record control over entity"
          - "assert this entity controls that one"
          - "add ownership and control edge"
          - "record a control relationship"
          - "assert controlling interest"
          - "claim a control relationship"
          - "add a control assertion"
          - "assert dominant influence"
          - "record GP statutory control"
        behavior: plugin
        metadata:
          tier: intent
          source_of_truth: kyc_stream
          scope: global
          noun: control_edge
          tags: [ubo, control, determination, stream-backed, dsl-kyc]
          phase_tags: [kyc]
          side_effects: state_write
        args:
          - name: subject-id
            type: uuid
            required: true
            description: Determination root (the subject stream)
          - name: from_entity_id
            type: uuid
            required: true
            description: Controlling entity
          - name: to_entity_id
            type: uuid
            required: true
            description: Controlled entity
          - name: kind
            type: string
            required: true
            description: "Control basis (fold::control::EdgeKind, payload key `kind` — control.rs::edge_kind_from_payload; canonical wire set: EDGE_KIND_WIRE_VALUES, TS.1 §1a). Trust roles are sub-kind-explicit: trust_settlor / trust_trustee / trust_protector / trust_beneficiary each map to their EdgeKind::TrustRole sub-kind, so distinct roles between the same (from,to) pair derive distinct edge ids and coexist under NoDuplicateActiveEdge. Unrecognized or omitted values are REJECTED at the op-normalizer before append (TS.1 §1b, fail-closed); the fold itself stays infallible — its dominant_influence catch-all remains only as the total-dispatch backstop for historical events."
            valid_values: [voting_rights, board_appointment, gp_statutory, designated_member, trust_settlor, trust_trustee, trust_protector, trust_beneficiary, nominee, dominant_influence, economic_interest]
          - name: edge-id
            type: uuid
            required: false
            description: Stable edge identity (generated if omitted)
          - name: percentage
            type: decimal
            required: false
            description: Percentage (for economic_interest edges)
          - name: trust-revocable
            type: boolean
            required: false
            description: "Whether the trust IS revocable — only meaningful on trust_settlor edges (TS.1 §2.1). Polarity: false = PROVEN irrevocable, the only value that excludes the settlor from trust_role_strategy candidates; true or absent both treat the trust as revocable, so the settlor is INCLUDED (fail-closed toward inclusion: over-identify, never silently drop a controller)."
        returns:
          type: record
          fields:
            - name: edge_id
              type: uuid
            - name: seq
              type: integer
            - name: deduped
              type: boolean
        three_axis:
          state_effect: preserving
          external_effects: []
          consequence:
            baseline: reviewable

