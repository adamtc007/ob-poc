# Workflow routing configuration for BPMN-Lite integration.
#
# Verbs listed here with route: orchestrated will be dispatched through
# the bpmn-lite gRPC service. All other verbs default to route: direct.
#
# Each orchestrated workflow requires:
#   - process_key: BPMN process key (matches compiled model)
#   - task_bindings: maps BPMN service task types to ob-poc verbs
#
# Task bindings tell the JobWorker which ob-poc verb to execute when
# bpmn-lite activates a job for that task type.

workflows:
  # KYC Open Case — first orchestrated workflow
  - verb_fqn: kyc-case.create
    route: orchestrated
    process_key: kyc-open-case
    correlation_field: case_id
    task_bindings:
      - task_type: create_case_record
        verb_fqn: kyc-case.create
        timeout_ms: 30000
        max_retries: 3

      - task_type: request_documents
        verb_fqn: document.solicit-batch
        timeout_ms: 60000
        max_retries: 3

      - task_type: record_decision
        verb_fqn: kyc.record-decision
        timeout_ms: 30000
        max_retries: 3

  # Document Solicitation — single document request lifecycle
  - verb_fqn: document.solicit
    route: orchestrated
    process_key: kyc-document-request
    correlation_field: workflow-instance-id
    task_bindings:
      - task_type: send_request_notification
        verb_fqn: notification.send-document-request
        timeout_ms: 30000
        max_retries: 3

      - task_type: validate_uploaded_document
        verb_fqn: document.verify
        timeout_ms: 60000
        max_retries: 3

      - task_type: update_requirement_status
        verb_fqn: requirement.create
        timeout_ms: 30000
        max_retries: 3

  # Document Solicitation Set — batch document request lifecycle
  - verb_fqn: document.solicit-batch
    route: orchestrated
    process_key: kyc-document-request-set
    correlation_field: workflow-instance-id
    task_bindings:
      - task_type: send_request_notification
        verb_fqn: notification.send-document-request
        timeout_ms: 30000
        max_retries: 3

      - task_type: validate_uploaded_document
        verb_fqn: document.verify
        timeout_ms: 60000
        max_retries: 3

      - task_type: update_requirement_status
        verb_fqn: requirement.create
        timeout_ms: 30000
        max_retries: 3

  # Entity Workstream Screen — screening.run waits (indefinitely, via a
  # correlated BPMN message) for the workstream's screening rows to all
  # reach a terminal status, then switches on the worst-of outcome
  # (EOP-PLAN-DAG-AWAITS-001 Phase 5). The message is fired by
  # kyc_stream_ops.rs's ScreeningComplete/ScreeningReviewHit handlers via
  # bpmn_integration::signal_outbox::queue_bpmn_signal once every screening
  # row for the workstream is CLEAR/HIT_CONFIRMED/HIT_DISMISSED.
  - verb_fqn: screening.run
    route: orchestrated
    process_key: entity-workstream-screen
    correlation_field: workstream_id
    task_bindings:
      - task_type: run_screenings
        verb_fqn: screening.run
        timeout_ms: 30000
        max_retries: 3

      - task_type: await_screening
        verb_fqn: screening.await-aggregate-outcome
        timeout_ms: 30000
        max_retries: 3
