# BPMN Workspace — DAG Taxonomy (2026-06-03)
#
# Stateless operations-menu projection. This is not a Designer authoring graph
# and does not claim BPMN instance lifecycle authority.

version: "1.0"
workspace: bpmn
dag_id: bpmn_dag

dsl_verb_reconciliation:
  bpmn_surface:
    - bpmn.compile
    - bpmn.start
    - bpmn.signal
    - bpmn.cancel
    - bpmn.inspect
  controller_surface:
    - bpmn-controller.start-instance
    - bpmn-controller.instance-status
    - bpmn-controller.list-instances
    - workflow.start-process

slots:
  - id: workspace_root
    stateless: true
    rationale: "Stateless menu for real definition and instance operations; structural authoring and infrastructure are excluded."
    # WS-2.A (EOP-PLAN-SEM-RESOLVER-001, ruled 2026-08-06): the Designer
    # authoring plane is referenced by EXACT content-hash pin, never by
    # promoting its operations into this palette (AST-mutation isolation
    # ruling). The pinned pack is compiled/validated on the bpmn-lite
    # side (utterance-engine/config/bpmn-semantic-pack.lock); the
    # cross-file consistency of this declaration is gated by
    # bpmn_authoring_plane_pin_is_consistent_and_well_formed in
    # rust/tests/domain_pack_config_qualification.rs.
    authoring_plane:
      pack_id: bpmn.designer
      pack_version: 1.0.0
      artifact_sha256: 0459649ce9082ba62aee48bc25ea8ab6e9071367ed69adcea7956072fbe215db
      source_sha256: 9c763264fdf51041eb75c88b028d03e2f3f9635d9260b7d563cdadf356c03e32
      authority: designer_authoring
      isolation: "Candidates stay Designer-side; never discoverable in the SemOS palette."
