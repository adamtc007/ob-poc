id: bpmn-ops
name: BPMN Operations
version: "1.0"
description: >
  Compile BPMN definitions and control workflow instances. Infrastructure pool
  lifecycle is intentionally exposed through the lifecycle-resources workspace,
  not this ordinary BPMN operations board.

invocation_phrases:
  - "bpmn operations"
  - "manage bpmn"
  - "workflow management"
  - "bpmn pool setup"
  - "bpmn instance query"

required_context: []
optional_context: []

workspaces:
  - bpmn

allowed_verbs:
  - bpmn.compile
  - bpmn.start
  - bpmn.signal
  - bpmn.cancel
  - bpmn.inspect
  - workflow.start-process
  - bpmn-controller.start-instance
  - bpmn-controller.instance-status
  - bpmn-controller.list-instances

forbidden_verbs: []

risk_policy:
  require_confirm_before_execute: true
  max_steps_without_confirm: 5

section_layout:
  - title: "BPMN Compiled Models"
    verb_prefixes:
      - "bpmn."
  - title: "Process Instances"
    verb_prefixes:
      - "bpmn-controller."

definition_of_done:
  - "BPMN process instances managed successfully"

progress_signals:
  - signal: processes_running
    description: "BPMN process instances active"
