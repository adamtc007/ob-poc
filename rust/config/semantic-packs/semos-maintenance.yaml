capabilities:
- id: journey.semos-maintenance
  adapter_binding: ob-poc.journey.semos-maintenance
  title: SemOS Maintenance
  intent_summary: Govern the SemOS registry. Author changesets for attributes, verbs,
    schemas, and constellations. Submit for review, validate, dry-run, and publish.
    Bridge ungoverned attributes. Recompute derived values.
  action_class: execute
  applicability: Use when the requested outcome belongs to the SemOS Maintenance journey.
  effect: Activates the SemOS Maintenance journey and constrains its governed operation
    surface.
  arguments: []
  phrases:
  - text: semos maintenance
    locale: en-GB
    role: canonical
    provenance: ob-poc.journey-pack.v1
  - text: registry governance
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: manage the registry
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: semantic os maintenance
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: attribute governance
