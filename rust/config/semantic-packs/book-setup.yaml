capabilities:
- id: journey.book-setup
  adapter_binding: ob-poc.journey.book-setup
  title: Book Setup
  intent_summary: Set up a client book — a collection of CBUs under a single apex
    entity. Supports Luxembourg SICAV and UK OEIC structures with jurisdiction-specific
    templates for fund creation, product assignment, and custody configuration.
  action_class: execute
  applicability: Use when the requested outcome belongs to the Book Setup journey.
  effect: Activates the Book Setup journey and constrains its governed operation surface.
  arguments: []
  phrases:
  - text: set up a book
    locale: en-GB
    role: canonical
    provenance: ob-poc.journey-pack.v1
  - text: configure client book
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: book setup
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: create a fund book
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: new book for client
    locale: en-GB
