schema_version: 1
pack:
  id: ob-poc.journey.platform-admin
  version: '1.0'
  domain: ob-poc.journey
  identity_namespace: ob-poc.journey.semantic
  canonicalization_version: 1
  dependencies: []
  provenance:
    source: rust/config/semantic-packs/platform-admin.yaml
    revision: journey-pack-v1
declarations:
  domain_types:
  - journey.pack
  slot_kinds: []
  focus_kinds:
  - journey.session
capabilities:
- id: journey.platform-admin
  adapter_binding: ob-poc.journey.platform-admin
  title: Platform Admin
  intent_summary: Reference-data vocabulary (roles, regulators, identifiers) and access/entitlement
    administration (teams, users, access-review campaigns). Scaffold — review naming
    and verb split before treating as final.
  action_class: execute
  applicability: Use when the requested outcome belongs to the Platform Admin journey.
  effect: Activates the Platform Admin journey and constrains its governed operation
    surface.
  arguments: []
  phrases:
  - text: manage roles
    locale: en-GB
    role: canonical
    provenance: ob-poc.journey-pack.v1
  - text: manage team access
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: run access review
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  positive_examples:
  - manage roles
  - manage team access
  - run access review
  negative_contrasts: []
  risk: reversible
  aliases: []
  extensions:
