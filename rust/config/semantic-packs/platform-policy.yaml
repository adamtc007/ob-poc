capabilities:
  - id: semantic.change.add
    adapter_binding: ob-poc.semantic.change.add
    title: Add semantic object
    intent_summary: Add an object through a governed changeset.
    action_class: create
    applicability: A changeset is approved for promotion.
    effect: A semantic object is added.
    arguments: []
    phrases: []
    positive_examples: []
    negative_contrasts: []
    risk: reversible
  - id: semantic.change.modify
    adapter_binding: ob-poc.semantic.change.modify
    title: Modify semantic object
    intent_summary: Modify an object through a governed changeset.
    action_class: update
    applicability: A changeset is approved for promotion.
    effect: A semantic object is modified.
    arguments: []
    phrases: []
    positive_examples: []
    negative_contrasts: []
    risk: reversible
  - id: semantic.change.remove
    adapter_binding: ob-poc.semantic.change.remove
    title: Remove semantic object
    intent_summary: Retire an object through a governed changeset.
