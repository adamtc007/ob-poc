policy:
  phrase_ambiguity: reject
  abstention:
    enabled: true
    candidate_id: abstain.none_of_the_above
  roles:
    - role: admin
      capabilities:
        - semantic.change.add
        - semantic.change.modify
        - semantic.change.remove
    - role: steward
      capabilities:
        - semantic.change.add
        - semantic.change.modify
  eligibility:
    - context: mode.research
      default: allow
      deny:
        - { kind: exact, value: authoring.publish }
        - { kind: exact, value: authoring.publish-batch }
        - { kind: prefix, value: governance. }
        - { kind: prefix, value: maintenance. }
      attributes:
        - feature.authoring
        - feature.full-introspection
    - context: mode.governed
      default: allow
      deny:
        - { kind: exact, value: authoring.propose }
        - { kind: exact, value: authoring.validate }
        - { kind: exact, value: authoring.dry-run }
        - { kind: exact, value: authoring.plan }
        - { kind: exact, value: authoring.diff }
        - { kind: prefix, value: changeset. }
      attributes:
        - feature.business-verbs
        - feature.maintenance
    - context: mode.maintenance
      default: allow
      deny:
        - { kind: prefix, value: cbu. }
        - { kind: prefix, value: entity. }
        - { kind: prefix, value: trading-profile. }
        - { kind: prefix, value: investor. }
