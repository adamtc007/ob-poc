capabilities:
- id: journey.kyc-case
  adapter_binding: ob-poc.journey.kyc-case
  title: KYC Case
  intent_summary: Open a KYC case for a client entity. This pack currently focuses
    on the durable case creation boundary so the case can be handed into the BPMN
    runtime cleanly. Follow-on workstream, screening, and document steps are handled
    after the case exists.
  action_class: execute
  applicability: Use when the requested outcome belongs to the KYC Case journey.
  effect: Activates the KYC Case journey and constrains its governed operation surface.
  arguments: []
  phrases:
  - text: open a KYC case
    locale: en-GB
    role: canonical
    provenance: ob-poc.journey-pack.v1
  - text: start KYC review
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: KYC case
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: new KYC
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: KYC renewal
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: run KYC
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  - text: compliance review
    locale: en-GB
    role: paraphrase
    provenance: ob-poc.journey-pack.v1
  positive_examples:
  - open a KYC case
  - start KYC review
  - KYC case
